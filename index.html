<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chronicle</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Kanit:ital,wght@1,900&family=Plus+Jakarta+Sans:ital,wght@0,600;0,700;0,800;1,800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Help button -->
  <button class="help-btn" id="openHelpBtn" aria-label="Help">?</button>

  <!-- Landing page -->
  <main class="landing-view">
    <div class="landing-content">
      <h1 class="logo-title">CHRONICLE</h1>
      <p class="tagline">The Daily Watch Puzzle.</p>
      <p class="sub-tagline">Guess the mystery watch!</p>
      <button class="play-btn" id="playBtn">Play</button>
    </div>
  </main>

  <!-- Help modal -->
  <div class="modal-overlay" id="helpModal">
    <div class="modal-card">
      <div class="modal-header">
        <h2 class="modal-title">How to Play</h2>
        <button class="modal-close" id="closeHelpBtn" aria-label="Close">×</button>
      </div>

      <p class="modal-text">Guess the daily mystery watch in <strong>7 tries</strong>.</p>
      <p class="modal-text">Each guess tests 7 attributes: Brand, Origin, Category, Movement, Size, Year, and Price.</p>

      <div class="legend-box">
        <div class="legend-row">
          <span class="chip chip-green"></span>
          <span><strong>Green:</strong> Exact match</span>
        </div>
        <div class="legend-row">
          <span class="chip chip-yellow"></span>
          <span><strong>Yellow:</strong> Close / Direction indicator</span>
        </div>
        <div class="legend-row">
          <span class="chip chip-grey"></span>
          <span><strong>Grey:</strong> No match</span>
        </div>
      </div>

      <button class="modal-ack-btn" id="ackHelpBtn">Got it</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
