<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chronicle</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="game-wrapper">
    <!-- Header -->
    <header class="game-header">
      <div class="header-side left">
        <button class="arcade-btn icon-only" id="helpBtn" aria-label="Help">?</button>
      </div>

      <div class="header-center">
        <h1 class="game-title">CHRONICLE</h1>
      </div>

      <div class="header-side right">
        <button class="arcade-btn icon-only" id="statsBtn" aria-label="Stats">S</button>
        <button class="arcade-btn icon-only" id="settingsBtn" aria-label="Settings">X</button>
      </div>
    </header>

    <!-- Mode Switcher -->
    <section class="mode-wrapper" aria-label="Difficulty Selection">
      <div class="mode-toggle">
        <button class="mode-btn active" data-mode="easy">Easy</button>
        <button class="mode-btn" data-mode="medium">Medium</button>
        <button class="mode-btn" data-mode="hard">Hard</button>
      </div>
    </section>

    <!-- Search Bar -->
    <section class="search-section" aria-label="Watch Search">
      <div class="search-bar">
        <input 
          type="text" 
          id="searchInput" 
          class="search-input" 
          placeholder="Search watch or reference..." 
          autocomplete="off"
        >
        <button class="arcade-btn submit-btn" id="guessBtn">Guess</button>
      </div>
    </section>

    <!-- Feedback Grid -->
    <section class="grid-section" id="gridSection" aria-label="Guess Feedback Grid">
      <!-- Column Headers -->
      <div class="grid-row grid-header">
        <div class="header-cell">Brand</div>
        <div class="header-cell">Origin</div>
        <div class="header-cell">Category</div>
        <div class="header-cell">Movement</div>
        <div class="header-cell">Size</div>
        <div class="header-cell">Year</div>
        <div class="header-cell">Price (PHP)</div>
      </div>

      <!-- Row 1 -->
      <div class="grid-row">
        <div class="tile empty"></div>
        <div class="tile empty"></div>
        <div class="tile empty"></div>
        <div class="tile empty"></div>
        <div class="tile empty"></div>
        <div class="tile empty"></div>
        <div class="tile empty"></div>
      </div>

      <!-- Row 2 -->
      <div class="grid-row">
        <div class="tile empty"></div>
        <div class="tile empty"></div>
        <div class="tile empty"></div>
        <div class="tile empty"></div>
        <div class="tile empty"></div>
        <div class="tile empty"></div>
        <div class="tile empty"></div>
      </div>

      <!-- Row 3 -->
      <div class="grid-row">
        <div class="tile empty"></div>
        <div class="tile empty"></div>
        <div class="tile empty"></div>
        <div class="tile empty"></div>
        <div class="tile empty"></div>
        <div class="tile empty"></div>
        <div class="tile empty"></div>
      </div>

      <!-- Row 4 -->
      <div class="grid-row">
        <div class="tile empty"></div>
        <div class="tile empty"></div>
        <div class="tile empty"></div>
        <div class="tile empty"></div>
        <div class="tile empty"></div>
        <div class="tile empty"></div>
        <div class="tile empty"></div>
      </div>

      <!-- Row 5 -->
      <div class="grid-row">
        <div class="tile empty"></div>
        <div class="tile empty"></div>
        <div class="tile empty"></div>
        <div class="tile empty"></div>
        <div class="tile empty"></div>
        <div class="tile empty"></div>
        <div class="tile empty"></div>
      </div>

      <!-- Row 6 -->
      <div class="grid-row">
        <div class="tile empty"></div>
        <div class="tile empty"></div>
        <div class="tile empty"></div>
        <div class="tile empty"></div>
        <div class="tile empty"></div>
        <div class="tile empty"></div>
        <div class="tile empty"></div>
      </div>

      <!-- Row 7 -->
      <div class="grid-row">
        <div class="tile empty"></div>
        <div class="tile empty"></div>
        <div class="tile empty"></div>
        <div class="tile empty"></div>
        <div class="tile empty"></div>
        <div class="tile empty"></div>
        <div class="tile empty"></div>
      </div>
    </section>
  </main>

</body>
</html>
