<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chronicle</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="game-wrapper">
    <!-- Header -->
    <header class="game-header">
      <div class="header-side left">
        <button class="arcade-btn icon-only" id="helpBtn" aria-label="Help">?</button>
      </div>

      <div class="header-center">
        <h1 class="game-title">CHRONICLE</h1>
      </div>

      <div class="header-side right">
        <button class="arcade-btn icon-only" id="statsBtn" aria-label="Stats">S</button>
        <button class="arcade-btn icon-only" id="settingsBtn" aria-label="Settings">X</button>
      </div>
    </header>
  </main>

</body>
</html>
